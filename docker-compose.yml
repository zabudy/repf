x-app: &app
  image: repf:local
  build:
    context: .
    dockerfile: infrastructure/Dockerfile
  environment: &app-env
    DEBUG: "false"
    WORKER_MODE: celery
    DATABASE_URL: postgresql+asyncpg://repf:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/repf
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    LLM_API_KEY: ${LLM_API_KEY:-}
    COMPATIBLE_LLM_URL: ${COMPATIBLE_LLM_URL:-}
    COMPATIBLE_LLM_MODEL: ${COMPATIBLE_LLM_MODEL:-qwen2.5}
    COMPATIBLE_LLM_KEY: ${COMPATIBLE_LLM_KEY:-}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    OLLAMA_URL: ${OLLAMA_URL:-}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
  volumes:
    - repf-cases:/app/data/processed
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repf
      POSTGRES_USER: repf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - repf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repf -d repf"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - repf-qdrant:/qdrant/storage
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - repf-ollama:/root/.ollama
    restart: unless-stopped

  init:
    <<: *app
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s data/processed/cases.json ] || [ ! -s data/processed/glossary.json ]; then
          python -m scripts.generate_knowledge_base
        fi
        python -m scripts.import_data --sql-only
        for attempt in 1 2 3 4 5; do
          if python -m scripts.index_qdrant; then exit 0; fi
          sleep 3
        done
        exit 1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 7s
      timeout: 4s
      retries: 12

  worker:
    <<: *app
    command: ["celery", "-A", "backend.worker.celery_app:celery", "worker", "-Q", "forecasts,evaluation", "--concurrency=2"]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["celery", "-A", "backend.worker.celery_app:celery", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  repf-db:
  repf-cases:
  repf-qdrant:
  repf-ollama:
