name: REPF checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=70
      - run: node --check frontend/app.js
      - run: python -m scripts.generate_knowledge_base --series 16 --housing 0
      - run: python -m scripts.import_data --sql-only
      - run: python -m scripts.run_eval --num-series 2 --horizons 3 --data-fractions 0.2 1
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci_example_password
          JWT_SECRET_KEY: ci_example_configuration_secret_00000
